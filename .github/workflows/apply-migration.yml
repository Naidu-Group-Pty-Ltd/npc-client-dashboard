name: Apply a migration

# Applies ONE named migration file to the Supabase project, on request.
#
# ## Why this is not `supabase db push`
#
# `supabase_migrations.schema_migrations` in this project does not record what
# has actually been applied. Measured on 2026-08-13: the ledger called 133
# migrations pending, and of the 93 tables and 183 functions those files
# declare, all but one family already existed. Migrations here have been applied
# through routes that record nothing, so the ledger under-reports by roughly two
# orders of magnitude.
#
# `db push` trusts that ledger. Running it would replay ~130 already-applied
# migrations, including data mutations — `listing_image_chrome_purge`,
# `aml_record_classification_correction` — where a second application is not a
# no-op. So this workflow applies exactly the one file it is given, and nothing
# else. Deciding *which* file is a human judgement made before dispatch, not a
# thing this workflow infers.
#
# ## Why it chunks
#
# The seeded template catalogue is a single ~19 MB INSERT carrying 393 rows of
# schema JSON. That is too large for one Management API request, so a statement
# of that shape is split on tuple boundaries and sent as several statements that
# each carry the file's own ON CONFLICT clause. The split is verified by
# reassembly before anything is sent: if the rebuilt tuple region is not
# byte-identical to the original, the job fails without touching the database.
#
# Anything smaller is sent whole, unmodified.
#
# ## Idempotence is the file's job, not this workflow's
#
# Chunks are separate statements, so a failure part-way leaves earlier chunks
# applied. That is safe for the catalogue seed because it upserts on
# (slug, version). Do not point this at a file that is not idempotent without
# reading it first.

on:
  workflow_dispatch:
    inputs:
      file:
        description: 'Migration file path, relative to the repo root'
        required: true
        type: string
        default: supabase/migrations/20260812090000_seed_template_library_v5_borrowing_capacity_portfolio.sql
      record_version:
        description: 'Record the file version in schema_migrations when it succeeds'
        required: false
        type: boolean
        default: true
      tuples_per_chunk:
        description: 'Rows per statement when a large INSERT has to be split'
        required: false
        type: string
        # 10 puts the catalogue seed's largest statement at ~1.1 MB. The rows
        # vary by an order of magnitude in size, so this is set from the
        # measured worst case rather than from the average.
        default: '10'

permissions:
  contents: read

# One writer at a time, and never cancel a run mid-way: a half-applied set of
# chunks is worse than a late one.
concurrency:
  group: apply-migration
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Check for a deploy credential
        id: gate
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -n "${TOKEN:-}" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo '::error title=No credential::SUPABASE_ACCESS_TOKEN is not set. Add it in Settings → Secrets → Actions.'
            exit 1
          fi

      - name: Require an explicit target project
        env:
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          # Fail closed — see deploy-supabase-functions.yml. This defaulted to
          # the prime's ref, so a mirror of this repo applied ITS migrations to
          # the prime's production database.
          if [ -z "${PROJECT_REF:-}" ]; then
            echo '::error title=No target project::Repository variable SUPABASE_PROJECT_REF is not set. Set it to THIS deployment'"'"'s own project ref before applying a migration.'
            exit 1
          fi

      - name: Apply
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          FILE: ${{ inputs.file }}
          RECORD_VERSION: ${{ inputs.record_version }}
          TUPLES_PER_CHUNK: ${{ inputs.tuples_per_chunk }}
        run: node .github/scripts/apply-migration.mjs
