name: Decommission withheld GoHighLevel functions

# This repository is the head of the CRM-independent line, a closed system
# that carries none of GoHighLevel (docs/crm/CRM_INDEPENDENCE.md). The tree no
# longer holds the nineteen GoHighLevel functions, but a project provisioned
# from the prime still has them DEPLOYED: a function the tree does not carry
# keeps running whatever it last ran, behind a router that no longer sends it
# anything. This workflow deletes those deployments, on demand, and nothing
# else:
#
# - workflow_dispatch only. Deleting a deployed function is a deliberate act
#   with a name in the Actions log, never a side effect of a push.
# - It can delete ONLY the names in scripts/lib/crmLineFeatures.mjs. The list
#   is read from that module rather than copied here, so this workflow and
#   the CI gates cannot disagree about what the line withholds.
# - It refuses any name whose directory is still in this tree: deleting a
#   function the tree would redeploy is a contradiction, not a decommission.
# - A function already absent is a no-op, not a failure, so a re-run after a
#   partial run finishes the job.
# - The project ref resolves exactly as the deploy workflow's does (variable,
#   then this repo's own config.toml preamble, never a literal), so a clone
#   that inherits this file deletes from ITS OWN project and nobody else's.

on:
  workflow_dispatch:
    inputs:
      functions:
        description: 'Space-separated subset of the withheld list. Empty = the whole list.'
        required: false
        default: ''

concurrency:
  group: decommission-crm-line-functions
  cancel-in-progress: false

jobs:
  decommission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: refuse to pretend
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "${TOKEN:-}" ]; then
            echo '::error::No SUPABASE_ACCESS_TOKEN secret is configured — nothing was deleted. Add it in Settings → Secrets and variables → Actions, then re-run.'
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read the withheld list
        id: list
        run: |
          set -euo pipefail
          withheld=$(node -e "import('./scripts/lib/crmLineFeatures.mjs').then(m => console.log(m.CRM_LINE_WITHHELD_FUNCTIONS.join(' ')))")
          if [ -z "$withheld" ]; then
            echo '::error::the withheld list is empty — nothing was deleted.'
            exit 1
          fi
          for fn in $withheld; do
            if [ -d "supabase/functions/$fn" ]; then
              echo "::error::'$fn' is withheld but its directory is in this tree — nothing was deleted."
              exit 1
            fi
          done
          echo "withheld=$withheld" >> "$GITHUB_OUTPUT"

      - name: Resolve this deployment's project
        id: project
        env:
          PROJECT_REF_VAR: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set -uo pipefail
          ref="${PROJECT_REF_VAR:-}"
          if [ -z "$ref" ] && [ -f supabase/config.toml ]; then
            ref=$(sed -n '/^\[/q; s/^[[:space:]]*project_id[[:space:]]*=[[:space:]]*"\([a-z]\{20\}\)".*/\1/p' \
              supabase/config.toml | head -1)
          fi
          if [ -z "$ref" ]; then
            echo '::error::no project ref could be resolved for this repository — nothing was deleted.'
            exit 1
          fi
          echo "deleting from project $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: delete the withheld GoHighLevel functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REQUESTED: ${{ inputs.functions }}
          WITHHELD: ${{ steps.list.outputs.withheld }}
          PROJECT_REF: ${{ steps.project.outputs.ref }}
        run: |
          set -uo pipefail
          list="${REQUESTED:-$WITHHELD}"
          failed=""
          for fn in $list; do
            case " $WITHHELD " in
              *" $fn "*) ;;
              *)
                echo "::error::'$fn' is not on the withheld list — this workflow deletes only the GoHighLevel functions the line does not carry."
                exit 1
                ;;
            esac
          done
          for fn in $list; do
            echo "::group::delete $fn"
            out=$(supabase functions delete "$fn" --project-ref "$PROJECT_REF" 2>&1) && status=0 || status=$?
            echo "$out"
            if [ "$status" -ne 0 ]; then
              if printf '%s' "$out" | grep -qiE 'not[ _-]?found|does not exist|404'; then
                echo "$fn was already absent"
              else
                failed="$failed $fn"
              fi
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::deletion failed for:$failed"
            exit 1
          fi
