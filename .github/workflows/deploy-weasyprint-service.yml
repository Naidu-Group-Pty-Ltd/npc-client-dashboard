name: Deploy the render container

# Ships `weasyprint-service/` to Cloud Run.
#
# This exists because nothing did. The image that turns every report into a PDF
# had no deploy path at all: `ci.yml` builds it to test it and publishes
# nothing, and there is no `docker push`, no `cloudbuild.yaml` and no `gcloud`
# anywhere else in this repository. So veraPDF, `output_intent`,
# `custom_metadata`, a font, an engine bump — each was inert in production until
# somebody ran commands by hand from a doc.
#
# ── Why this never cuts over traffic on its own ──────────────────────────────
# `deploy-supabase-functions.yml` fires on push to `main` under
# `supabase/functions/**`. A merge touching both trees starts two deploys at
# once, and the render routes ask the engine for `pdf/ua-1`: an engine without
# that variant raises `KeyError` inside `Document._render`, which the service
# returns as a 500 on *every* report. If the functions win that race,
# production breaks completely.
#
# So a push only ever **stages**: it builds, deploys a revision with
# `--no-traffic`, verifies it on its own tagged URL, and stops. Promoting that
# revision is a deliberate `workflow_dispatch` with `promote: cutover`. The
# ordering constraint stays a human decision, which is what
# `docs/reports/CONTAINER_RELEASE.md` says it is.
#
# ── Two ways in, and the one that needs no terminal ──────────────────────────
# The designed authentication is Workload Identity Federation: GitHub mints a
# short-lived OIDC token per run and Google exchanges it for a scoped access
# token, so there is no service account key to store, leak or rotate.
# `id-token: write` below is what makes that possible and is the only unusual
# permission here. Its one-time setup is a gcloud session
# (`docs/reports/CONTAINER_RELEASE.md`), and on 15 Sep 2026 that was the
# whole problem: the render service stopped serving, nobody had gcloud, and
# the three variables had never been set — so a workflow that existed to
# remove the by-hand deploy could not deploy at all.
#
# So a service-account key is accepted as the second way in: one repository
# secret, `GCP_SA_KEY`, holding the JSON key that the Google Cloud console
# creates with clicks (IAM & Admin → Service Accounts → Keys). Its project is
# read from the key itself. It is the less careful credential — it does not
# expire, so it is rotated by hand — and it is deliberately second: when the
# three federation variables are set they win, and the key can be deleted.
#
# Opt-in by configuration either way, the same posture as the Supabase
# workflow: with neither configured this reports what it would have done and
# stops, so this file starts nothing and paints nothing red.

on:
  workflow_dispatch:
    inputs:
      promote:
        description: 'canary = stage with no traffic. cutover = stage, verify, then send traffic.'
        required: true
        default: canary
        type: choice
        options: [canary, cutover]
      image_tag:
        description: 'Image tag. Defaults to the short commit SHA.'
        required: false
        type: string
      mode:
        description: 'release = build a new image, stage, verify (and promote when asked). redeploy = no build: deploy the image the service ALREADY runs as a new revision and send it traffic — the remedy for a revision that stopped serving.'
        required: false
        default: release
        type: choice
        options: [release, redeploy]
      memory:
        description: 'redeploy only: the memory limit. 4Gi when the revision logs say the memory limit was exceeded.'
        required: false
        default: 2Gi
        type: string
  push:
    branches: [main]
    paths:
      - 'weasyprint-service/**'
      - '.github/workflows/deploy-weasyprint-service.yml'

permissions:
  contents: read
  # Mints the OIDC token Google exchanges. Without it `auth` fails with a
  # message about the ID token request URL being unset, which reads like a
  # configuration problem in Google rather than a permission in GitHub.
  id-token: write

# Never two releases of one image at once, and never cancel one mid-flight: a
# half-finished cutover is worse than a late one.
concurrency:
  group: deploy-weasyprint-service
  cancel-in-progress: false

env:
  REGION: ${{ vars.GCP_REGION || 'australia-southeast1' }}
  SERVICE: ${{ vars.WEASYPRINT_SERVICE_NAME || 'weasyprint-service' }}

jobs:
  # ── Is this repository configured to deploy at all? ─────────────────────────
  # A separate job rather than a step so everything downstream can hang off one
  # `needs`, and so an unconfigured repository sees one clear summary instead of
  # a red run it did not ask for.
  gate:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      # `wif` or `key` — which sign-in the jobs below use.
      auth: ${{ steps.check.outputs.auth }}
      # The project, from the variable or from the key itself.
      project: ${{ steps.check.outputs.project }}
    steps:
      - id: check
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOYER: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          set -euo pipefail
          missing=''
          [ -n "${PROJECT_ID:-}" ] || missing="$missing GCP_PROJECT_ID"
          [ -n "${PROVIDER:-}" ]   || missing="$missing GCP_WORKLOAD_IDENTITY_PROVIDER"
          [ -n "${DEPLOYER:-}" ]   || missing="$missing GCP_DEPLOY_SERVICE_ACCOUNT"

          if [ -z "$missing" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo 'auth=wif' >> "$GITHUB_OUTPUT"
            echo "project=$PROJECT_ID" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "${SA_KEY:-}" ]; then
            # The key is read from the environment and one field is printed;
            # the key itself never reaches a log (secrets are masked, and this
            # never echoes it).
            project="${PROJECT_ID:-$(printf '%s' "$SA_KEY" | jq -r '.project_id // ""')}"
            if [ -z "$project" ]; then
              echo '::error::GCP_SA_KEY carries no project_id and GCP_PROJECT_ID is not set'
              exit 1
            fi
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo 'auth=key' >> "$GITHUB_OUTPUT"
            echo "project=$project" >> "$GITHUB_OUTPUT"
            echo "signing in with the GCP_SA_KEY secret, project $project"
            exit 0
          fi

          echo 'ready=false' >> "$GITHUB_OUTPUT"
          {
            echo '### The render container was NOT deployed'
            echo
            echo 'No Google Cloud sign-in is configured, so this run changed nothing. Either:'
            echo
            echo '- paste a service-account key (JSON, from the Google Cloud console) into the'
            echo '  repository secret `GCP_SA_KEY` (Settings → Secrets and variables → Actions → Secrets) — no terminal needed; or'
            echo '- set the federated-deploy variables (Settings → Secrets and variables → Actions → Variables), which need a one-time gcloud session:'
            echo
            for v in $missing; do echo "- \`$v\`"; done
            echo
            echo 'Both are described in `docs/reports/CONTAINER_RELEASE.md`.'
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Redeploy what already serves, with no build ─────────────────────────────
  # The 15 Sep 2026 remedy (`docs/reports/RENDER_SERVICE_AVAILABILITY.md`): a
  # revision stopped serving — Cloud Run's own 500 page to every request,
  # including an unauthenticated GET / — while the image was fine. A new
  # revision of the same image is what `gcloud run deploy` does from a
  # terminal; this is that, from a workflow_dispatch, so nobody needs one.
  # It names no environment variable, so WEASYPRINT_SERVICE_TOKEN survives,
  # and it proves the result by effect: the front door after, and the engine
  # version behind it.
  redeploy:
    needs: gate
    if: needs.gate.outputs.ready == 'true' && inputs.mode == 'redeploy'
    runs-on: ubuntu-latest
    env:
      PROJECT: ${{ needs.gate.outputs.project }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - if: needs.gate.outputs.auth == 'wif'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - if: needs.gate.outputs.auth == 'key'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v3

      - id: before
        name: What the front door answers before
        run: |
          set -euo pipefail
          url=$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format='value(status.url)')
          echo "url=$url" >> "$GITHUB_OUTPUT"
          # GET / needs no token and no engine: a JSON listing means the app is
          # up; an HTML "Server Error" page means no instance took the request.
          curl -sS -o /tmp/before.txt -w "GET $url/ -> HTTP %{http_code} in %{time_total}s\n" "$url/" || true
          head -c 300 /tmp/before.txt; echo
          gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" \
            --format='yaml(status.conditions,status.traffic,status.latestReadyRevisionName,status.latestCreatedRevisionName)'

      - name: Why the revision cannot serve (the runbook's table reads these lines)
        run: |
          gcloud logging read "resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"$SERVICE\" AND severity>=ERROR" \
            --project "$PROJECT" --limit 30 --freshness 3d --format='value(timestamp,textPayload)' || true

      - id: deploy
        name: Deploy the serving image as a new revision
        run: |
          set -euo pipefail
          ready=$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format='value(status.latestReadyRevisionName)')
          if [ -z "$ready" ]; then
            ready=$(gcloud run revisions list --service "$SERVICE" --project "$PROJECT" --region "$REGION" --format='value(metadata.name)' --limit 1)
          fi
          image=$(gcloud run revisions describe "$ready" --project "$PROJECT" --region "$REGION" --format='value(spec.containers[0].image)')
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "redeploying $image (the image on $ready)"
          gcloud run deploy "$SERVICE" --project "$PROJECT" --image "$image" --region "$REGION" --platform managed \
            --allow-unauthenticated --memory "${{ inputs.memory || '2Gi' }}" --cpu 2 --concurrency 4 --timeout 600 \
            --min-instances 0 --max-instances 10

      - name: The front door answers, and the engine behind it is the pinned one
        env:
          URL: ${{ steps.before.outputs.url }}
        run: |
          set -euo pipefail
          code=000
          for i in 1 2 3 4 5 6; do
            code=$(curl -sS -o /tmp/after.txt -w '%{http_code}' "$URL/" || echo 000)
            [ "$code" = "200" ] && break
            echo "GET / answered $code; waiting 10s ($i/6)"; sleep 10
          done
          echo "GET / -> HTTP $code"; head -c 300 /tmp/after.txt; echo
          [ "$code" = "200" ] || { echo '::error::the service still does not serve — read the log lines above'; exit 1; }
          token=$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" \
            --format=json | jq -r '[.spec.template.spec.containers[]?.env[]? | select(.name == "WEASYPRINT_SERVICE_TOKEN" or .name == "WEASYPRINT_API_KEY") | .value | select(. != null and . != "")] | first // ""')
          echo "::add-mask::$token"
          pinned=$(grep -oP '(?<=^weasyprint==)[\d.]+' weasyprint-service/requirements.txt)
          got=$(curl -sf -H "Authorization: Bearer $token" "$URL/version" | jq -r '.weasyprint // ""')
          echo "pinned=$pinned live=$got"
          [ "$pinned" = "$got" ] || { echo "::error::engine drift: expected $pinned, live runs $got"; exit 1; }

      - name: Say what was done
        if: always()
        run: |
          {
            echo '### Render container redeployed'
            echo
            echo "- image: \`${{ steps.deploy.outputs.image }}\`"
            echo "- url: ${{ steps.before.outputs.url }}"
            echo
            echo 'Now generate one report with a chosen template: the toast'
            echo '"Your chosen template was drawn in the browser" must NOT appear.'
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Build, and let the image check itself ───────────────────────────────────
  # Cloud Build does the work, so no Docker daemon is needed on the runner. The
  # build IS the first gate: the Dockerfile fails if a brand face does not
  # resolve, if veraPDF does not install, or if `selfcheck.py` finds a
  # substituted face, an untagged render, a moved capability — or a specimen
  # that does not validate as PDF/UA-1.
  build:
    needs: gate
    if: needs.gate.outputs.ready == 'true' && inputs.mode != 'redeploy'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - id: image
        env:
          PROJECT_ID: ${{ needs.gate.outputs.project }}
          # `gcr.io` is what `weasyprint-service/README.md` has always used.
          # It is on its way out in favour of Artifact Registry; set
          # WEASYPRINT_IMAGE to an `…-docker.pkg.dev/…` path to move, rather
          # than forcing that migration as a side effect of this workflow.
          BASE: ${{ vars.WEASYPRINT_IMAGE }}
          TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          base="${BASE:-gcr.io/$PROJECT_ID/weasyprint-service}"
          tag="${TAG:-$(git rev-parse --short HEAD)}"
          echo "ref=${base}:${tag}" >> "$GITHUB_OUTPUT"
          echo "building ${base}:${tag}"

      - if: needs.gate.outputs.auth == 'wif'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - if: needs.gate.outputs.auth == 'key'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v3

      # --timeout: the default is ten minutes, and the veraPDF layer alone
      # fetches a 33 MB installer and installs a JRE before `pip install` of the
      # engine has started.
      - name: Build on Cloud Build
        run: |
          gcloud builds submit \
            --project "${{ needs.gate.outputs.project }}" \
            --tag "${{ steps.image.outputs.ref }}" \
            --timeout=1800s \
            ./weasyprint-service

  # ── Stage a revision that serves nobody ─────────────────────────────────────
  stage:
    needs: [gate, build]
    if: needs.gate.outputs.ready == 'true' && inputs.mode != 'redeploy'
    runs-on: ubuntu-latest
    outputs:
      canary: ${{ steps.deploy.outputs.canary }}
      previous: ${{ steps.previous.outputs.revision }}
    steps:
      - if: needs.gate.outputs.auth == 'wif'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - if: needs.gate.outputs.auth == 'key'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v3

      # Recorded before anything moves. After a cutover nothing else remembers
      # which revision was serving, and that is precisely when it is wanted.
      # `--format=json` piped to jq rather than a gcloud projection. The
      # projection mini-language is easy to write and hard to verify — one that
      # matches nothing yields an empty string, indistinguishable here from "no
      # revision is serving", which would produce a rollback command pointing at
      # nothing. jq is on every ubuntu-latest runner.
      - id: previous
        name: Remember the revision currently serving traffic
        run: |
          set -euo pipefail
          rev=$(gcloud run services describe "$SERVICE" \
                  --project "${{ needs.gate.outputs.project }}" --region "$REGION" \
                  --format=json 2>/dev/null \
                | jq -r '[.status.traffic[]? | select((.percent // 0) > 0)] | sort_by(.percent) | reverse | .[0].revisionName // ""' || true)
          echo "revision=${rev}" >> "$GITHUB_OUTPUT"
          echo "currently serving: ${rev:-<none — first deploy>}"

      # `--allow-unauthenticated` is deliberate: the service does its own bearer
      # check and refuses everything when no token is set, so it fails closed.
      # Cloud Run IAM in front would mean a second credential for ten edge
      # functions to hold and rotate.
      #
      # `--timeout 600` matches WEASYPRINT_TIMEOUT_MS in weasyprintClient.ts. A
      # forty-page report with inlined assets is minutes; a shorter timeout
      # turns a slow render into a killed worker.
      #
      # 2Gi is unchanged by the veraPDF layer. veraPDF is a JVM but the service
      # never invokes it at runtime — it runs at build time inside selfcheck.py.
      # The layer costs image size, and so cold-start pull time, not RAM.
      - id: deploy
        name: Deploy with no traffic
        run: |
          set -euo pipefail
          tag="ci${GITHUB_SHA::7}"
          gcloud run deploy "$SERVICE" \
            --project "${{ needs.gate.outputs.project }}" \
            --image "${{ needs.build.outputs.image }}" \
            --region "$REGION" \
            --platform managed \
            --allow-unauthenticated \
            --memory 2Gi --cpu 2 \
            --concurrency 4 --timeout 600 \
            --min-instances 0 --max-instances 10 \
            --no-traffic --tag "$tag"

          url=$(gcloud run services describe "$SERVICE" \
                  --project "${{ needs.gate.outputs.project }}" --region "$REGION" \
                  --format=json \
                | jq -r --arg tag "$tag" '[.status.traffic[]? | select(.tag == $tag) | .url] | first // ""')
          # An empty URL means the tag did not attach, and every check below
          # would then run against nothing and pass. Fail here instead.
          [ -n "$url" ] || { echo "::error::the tagged revision has no URL"; exit 1; }
          echo "canary=$url" >> "$GITHUB_OUTPUT"
          echo "staged at $url — no production traffic"

  # ── Prove the new revision before anyone reaches it ─────────────────────────
  verify:
    # `build` is here for its `image` output, which the closing summary names.
    # Without it that expression resolves to an empty string and the summary
    # reports a release of nothing in particular.
    needs: [gate, build, stage]
    if: needs.gate.outputs.ready == 'true' && inputs.mode != 'redeploy'
    runs-on: ubuntu-latest
    env:
      CANARY: ${{ needs.stage.outputs.canary }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - if: needs.gate.outputs.auth == 'wif'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - if: needs.gate.outputs.auth == 'key'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v3

      # Read from the deployed service rather than kept as a GitHub secret. The
      # deploy account can already describe the service, and a third copy of
      # this token would be a third place to rotate it — which is how the two
      # existing copies drift.
      - id: token
        name: Read the service token from the service itself
        run: |
          set -euo pipefail
          # Captured into a variable, never echoed, and masked before it can
          # reach a log. `run:` scripts log the command rather than its output,
          # so the value does not appear from this substitution.
          value=$(gcloud run services describe "$SERVICE" \
            --project "${{ needs.gate.outputs.project }}" --region "$REGION" \
            --format=json | jq -r '[.spec.template.spec.containers[]?.env[]? | select(.name == "WEASYPRINT_SERVICE_TOKEN" or .name == "WEASYPRINT_API_KEY") | .value | select(. != null and . != "")] | first // ""')
          if [ -z "$value" ]; then
            echo '::error::WEASYPRINT_SERVICE_TOKEN is not set on the service — it fails closed and refuses every request'
            exit 1
          fi
          echo "::add-mask::$value"
          echo "value=$value" >> "$GITHUB_OUTPUT"

      # The pin is read from requirements.txt rather than written here. A
      # hardcoded version in a workflow is a second source of truth that goes
      # stale silently, which is the whole class of defect PINNED_ENGINE exists
      # to prevent.
      - name: The canary runs the pinned engine
        env:
          # Through the environment rather than interpolated into the script.
          # A `${{ }}` substitution is spliced into the shell text itself; an
          # env var is handed to the process, which keeps the token out of the
          # script file the runner writes to disk.
          TOKEN: ${{ steps.token.outputs.value }}
        run: |
          set -euo pipefail
          PINNED=$(grep -oP '(?<=^weasyprint==)[\d.]+' weasyprint-service/requirements.txt)
          GOT=$(curl -sf -H "Authorization: Bearer $TOKEN" \
                  "$CANARY/version" | jq -r '.weasyprint // ""')
          echo "pinned=$PINNED canary=$GOT"
          [ "$PINNED" = "$GOT" ] || { echo "::error::engine drift: expected $PINNED, canary runs $GOT"; exit 1; }

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci --no-audit --no-fund

      # Writes reports/html/borrowing-capacity.html as a side effect.
      - name: Build a real report
        run: npx vitest run src/lib/reports/borrowingCapacity/__tests__/render.spec.ts

      # The step that proves the new options are live. `--capabilities`
      # reconciles what the engine reports against REQUIRED_OPTIONS, which now
      # includes `output_intent` and `custom_metadata` — an image without them
      # fails here rather than in a client's document.
      - name: The canary agrees with engineSupport.pure.ts
        env:
          # `engineCheck.mts` falls back to this variable when `--token` is
          # absent, so the flag is not needed at all.
          WEASYPRINT_SERVICE_TOKEN: ${{ steps.token.outputs.value }}
        run: |
          npx tsx scripts/reports/engineCheck.mts \
            --service "$CANARY" --capabilities \
            reports/html/borrowing-capacity.html

      # `strict: true` turns any engine warning into a 422. It is off for
      # client-facing renders — a dropped `text-wrap` is cosmetic and a person
      # waiting on a report is not served by an error — and on here, where a
      # dropped declaration is a design decision that did not reach the page.
      - name: The canary renders that report whole
        env:
          TOKEN: ${{ steps.token.outputs.value }}
        run: |
          set -euo pipefail
          node -e '
            const fs = require("node:fs");
            fs.writeFileSync("/tmp/bc.json", JSON.stringify({
              html: fs.readFileSync("reports/html/borrowing-capacity.html", "utf8"),
              pdf_variant: "pdf/ua-1", output_intent: "srgb",
              tagged: true, strict: true,
            }));
          '
          curl -sf -X POST "$CANARY/render" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -D /tmp/bc.headers --data @/tmp/bc.json -o /tmp/bc.pdf
          head -c 5 /tmp/bc.pdf | grep -q '%PDF-' || { echo '::error::not a PDF'; exit 1; }
          grep -qi '^x-pdf-tagged: *1' /tmp/bc.headers \
            || { echo '::error::the report came back untagged'; exit 1; }
          grep -qi '^x-weasyprint-warning-count: *0' /tmp/bc.headers || {
            echo '::error::the engine did not render the report whole'
            grep -i '^x-weasyprint-warnings:' /tmp/bc.headers
            exit 1
          }
          echo "canary rendered $(wc -c < /tmp/bc.pdf) bytes, tagged, no warnings"

      - name: Say what is staged and what would promote it
        run: |
          {
            echo '### Render container staged, not serving'
            echo
            echo "- image: \`${{ needs.build.outputs.image }}\`"
            echo "- canary: ${CANARY}"
            echo "- currently serving: \`${{ needs.stage.outputs.previous }}\`"
            echo
            echo 'Verified: pinned engine, capability reconciliation, a real report rendered whole and tagged.'
            echo
            echo 'To send traffic to it, run this workflow again with **promote: cutover**.'
            echo 'Deploy the render edge functions only *after* that — they ask for `pdf/ua-1`.'
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Send traffic, only when a person asked for it ───────────────────────────
  promote:
    needs: [gate, build, stage, verify]
    if: needs.gate.outputs.ready == 'true' && inputs.promote == 'cutover' && inputs.mode != 'redeploy'
    runs-on: ubuntu-latest
    steps:
      - if: needs.gate.outputs.auth == 'wif'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - if: needs.gate.outputs.auth == 'key'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v3

      # `--to-latest` sends traffic; it does not remove the tag. A tag pins its
      # revision against garbage collection, so leaving one behind on every
      # release accumulates revisions that can never be reclaimed — and Cloud
      # Run has a hard ceiling on them. Removing it here is the only place that
      # knows the release finished.
      #
      # A canary that is never promoted keeps its tag deliberately: that is the
      # thing somebody may still want to look at. `docs/reports/CONTAINER_RELEASE.md`
      # says how to clear those.
      - name: Send traffic to the verified revision
        run: |
          set -euo pipefail
          gcloud run services update-traffic "$SERVICE" \
            --project "${{ needs.gate.outputs.project }}" --region "$REGION" \
            --to-latest
          gcloud run services update-traffic "$SERVICE" \
            --project "${{ needs.gate.outputs.project }}" --region "$REGION" \
            --remove-tags "ci${GITHUB_SHA::7}"

      # The same check as on the canary, against the live URL. `--to-latest` can
      # succeed while traffic lands somewhere unexpected if another revision was
      # deployed between the two jobs, and the version is the cheapest thing
      # that would show it.
      - name: Live traffic is on the pinned engine
        run: |
          set -euo pipefail
          url=$(gcloud run services describe "$SERVICE" \
                  --project "${{ needs.gate.outputs.project }}" --region "$REGION" \
                  --format='value(status.url)')
          token=$(gcloud run services describe "$SERVICE" \
            --project "${{ needs.gate.outputs.project }}" --region "$REGION" \
            --format=json | jq -r '[.spec.template.spec.containers[]?.env[]? | select(.name == "WEASYPRINT_SERVICE_TOKEN" or .name == "WEASYPRINT_API_KEY") | .value | select(. != null and . != "")] | first // ""')
          echo "::add-mask::$token"
          got=$(curl -sf -H "Authorization: Bearer $token" "$url/version" | jq -r '.weasyprint // ""')
          echo "live at $url runs weasyprint $got"

      # Written with the real revision name substituted, so recovering never
      # needs anyone to find a document first.
      - name: Leave the rollback command behind
        if: always()
        run: |
          {
            echo '### Render container promoted'
            echo
            echo "Live on \`${{ needs.build.outputs.image }}\`."
            echo
            echo 'Roll back with:'
            echo
            echo '```bash'
            echo "gcloud run services update-traffic ${SERVICE} \\"
            echo "  --project ${{ needs.gate.outputs.project }} --region ${REGION} \\"
            echo "  --to-revisions=${{ needs.stage.outputs.previous }}=100"
            echo '```'
            echo
            echo 'If the render edge functions have already shipped, roll those back too —'
            echo 'they ask for `pdf/ua-1` and an older engine returns a 500 on every report.'
          } >> "$GITHUB_STEP_SUMMARY"
