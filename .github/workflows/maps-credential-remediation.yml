name: Maps credential remediation (control plane only)

# Creates and installs a NEW dedicated backend Google Maps credential for this
# deployment, and nothing else.
#
# ## Why this exists
#
# `GOOGLE_MAPS_API_KEY` holds a key whose owning Google Cloud project is not
# known to this repository, and which returns `REQUEST_DENIED` with the
# billing-specific message. Every geocode in the reporting pipeline therefore
# fails, `location_intelligence` is null on every report, and the walk score,
# schools, healthcare, transport and Distance Matrix readings are all absent.
#
# The remedy is NOT to repair that key. It is preserved untouched, because it
# may serve another module, deployment, site, app, integration, automation or
# vendor outside this codebase, and absence of a reference here is not absence
# of use. This workflow mints a SECOND, dedicated credential in the project this
# repository does control, and repoints only this deployment at it.
#
# ## What this is NOT
#
# Google Cloud is a CONTROL PLANE here and nothing else. Supabase Edge Functions
# remain the production Maps runtime, exactly as today. There is no Cloud Run
# service, no Cloud Run Job, no Cloud Build, no Docker image, no Compute Engine,
# no GKE and no Artifact Registry anywhere in this file — asserted by the
# `no-google-runtime` job below rather than promised in a comment.
#
# ## The legacy key
#
# LEGACY GOOGLE MAPS KEY - PRESERVED / DEPENDENCY STATUS UNKNOWN.
# This workflow never lists, reads, describes, updates, restricts, renames,
# disables, deletes or undeletes any key it did not itself create. The key it
# creates is identified by the resource name that its own `create` call
# returned, never by a display-name match over a list — because a list is how
# you touch a key you did not mean to touch.

# ## Run this from `main`, not from a branch
#
# Measured 2026-09-12, run 34698279711: the first push of this file from
# `claude/reporting-engine-audit-4850hs` resolved both repository variables
# correctly and was then refused by Google with
#
#     {"error":"unauthorized_client",
#      "error_description":"The given credential is rejected by the attribute condition."}
#
# That names the WIF PROVIDER's attribute condition, which is a different
# control from the `roles/iam.workloadIdentityUser` binding on the service
# account - the binding says who may impersonate, the condition says whose
# token is accepted at all. Confusing the two sends you to the wrong remedy.
#
# It is not scoped to a named workflow file: `deploy-pdf-parse-service.yml` and
# `deploy-weasyprint-service.yml` are two different files and both federate
# successfully. What they have in common is that both are `push: [main]` plus
# `workflow_dispatch`, so every successful federation in this repository's
# history has come from `main`. The condition is on the ref.
#
# So `execute` and `cleanup` are dispatched from `main`. The branch push
# trigger below still earns its place: it runs the no-runtime gate, the mode
# resolution and the YAML itself on every edit, which is where the cheap
# mistakes are. It runs NO job that talks to Google - a push cannot federate
# from a branch, so a probe on that path would be a permanently red check that
# means nothing, and a check nobody believes is worse than no check.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe = read-only reconnaissance. execute = full remediation. cleanup = remove the temporary IAM.'
        required: true
        default: probe
        type: choice
        options: [probe, execute, cleanup]
  push:
    branches: [claude/reporting-engine-audit-4850hs]
    paths:
      - '.github/workflows/maps-credential-remediation.yml'
      - '.github/maps-remediation/MODE'

permissions:
  contents: read
  id-token: write

concurrency:
  group: maps-credential-remediation
  cancel-in-progress: false

env:
  GCP_PROJECT: npc-property-dashboard
  GCP_PROJECT_NUMBER: '696345390317'
  KEY_DISPLAY_NAME: aurixa-maps-backend-prod
  # The one address the remediation is proved against. Cowra, NSW 2794.
  PROBE_ADDRESS: '48 Redfern Street, Cowra NSW 2794'

jobs:
  # ---------------------------------------------------------------------------
  # The no-runtime rule, enforced rather than asserted.
  # ---------------------------------------------------------------------------
  no-google-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Needed to diff against the default branch. A shallow clone makes
          # the WeasyPrint guard below pass by failing, which is worse than
          # having no guard at all.
          fetch-depth: 0

      - name: Refuse any Google runtime provisioning in this workflow
        run: |
          set -euo pipefail
          F=.github/workflows/maps-credential-remediation.yml
          P=.github/maps-remediation/FORBIDDEN-COMMANDS

          # The patterns live in their own file on purpose: a gate that spells
          # out the command forms it forbids matches ITSELF, and then either
          # fails always or has to exempt its own lines, which is the hole.
          #
          # Comments are stripped before judging, so the prose above that NAMES
          # the prohibition cannot trip the check that enforces it.
          sed -E 's/#.*$//' "$F" > /tmp/judged.txt

          BAD=0
          while IFS= read -r PATTERN; do
            [ -n "$PATTERN" ] || continue
            if grep -nE "(^|[^[:alnum:]_./-])${PATTERN}([^[:alnum:]_-]|$)" /tmp/judged.txt; then
              echo "::error title=Google runtime provisioning::forbidden command form appears in ${F}"
              BAD=1
            fi
          done < "$P"

          if [ "$BAD" -ne 0 ]; then
            echo '::error::This workflow may only administer the Google control plane.'
            exit 1
          fi
          echo "OK - none of the $(grep -c . "$P") forbidden command forms appears outside a comment."

      - name: Confirm the WeasyPrint runtime is untouched by this branch
        run: |
          set -euo pipefail

          # A failed `git diff` pipes nothing into grep, grep returns 1, and the
          # guard reads that as "no violation" - so the diff must be proven to
          # have RUN before its output is judged.
          git fetch --no-tags origin main
          BASE="$(git merge-base origin/main HEAD)"
          [ -n "$BASE" ] || { echo '::error title=Guard::no merge base with origin/main'; exit 1; }

          git diff --name-only "$BASE" HEAD > /tmp/changed.txt
          echo "Files changed against origin/main: $(wc -l < /tmp/changed.txt)"

          if grep -E '^(weasyprint-service/|\.github/workflows/deploy-weasyprint-service\.yml)' /tmp/changed.txt; then
            echo '::error title=WeasyPrint touched::This programme must not modify the WeasyPrint runtime.'
            exit 1
          fi
          echo 'OK - weasyprint-service/ and its deploy workflow are unmodified on this branch.'

  # ---------------------------------------------------------------------------
  # Resolve which mode this run is in.
  # ---------------------------------------------------------------------------
  mode:
    runs-on: ubuntu-latest
    needs: no-google-runtime
    outputs:
      mode: ${{ steps.pick.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - id: pick
        name: Resolve mode (dispatch input wins, else the checked-in MODE file)
        env:
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_MODE:-}" ]; then
            M="$INPUT_MODE"
            SRC='workflow_dispatch input'
          else
            M="$(tr -d '[:space:]' < .github/maps-remediation/MODE)"
            SRC='.github/maps-remediation/MODE'
          fi
          case "$M" in
            probe|execute|cleanup) : ;;
            *) echo "::error title=Bad mode::'$M' is not probe, execute or cleanup."; exit 1 ;;
          esac
          echo "mode=$M" >> "$GITHUB_OUTPUT"
          echo "Mode: $M   (from $SRC)"
          {
            echo "## Maps credential remediation"
            echo
            echo "**Mode:** \`$M\` (from $SRC)"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # PROBE - read only. Changes nothing. Safe to run at any time.
  # ---------------------------------------------------------------------------
  probe:
    runs-on: ubuntu-latest
    needs: mode
    # Deliberate invocation is required on BOTH counts: the mode must say so
    # AND the run must be a dispatch. Landing on `main` cannot start this,
    # even if someone later adds `main` to the push branches above.
    if: needs.mode.outputs.mode == 'probe' && github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Federation is refused with "rejected by the attribute condition", and
      # the documented provider maps only `assertion.sub` and
      # `assertion.repository` - neither of which can tell this workflow apart
      # from `deploy-pdf-parse-service.yml`, which federated successfully on
      # this same ref and event on 2026-08-11. So the deployed condition reads
      # a claim the documentation never mapped. This step prints WHICH claims
      # this workflow actually presents, so the fix is chosen from fact.
      #
      # The token is requested from GitHub and NEVER exchanged with Google,
      # never printed, never written to an artifact. It is masked the instant
      # it exists, only the PAYLOAD segment is decoded, the signature segment
      # is never touched, and only an allow-list of identity claims is shown.
      - name: GitHub OIDC claims this workflow presents (never exchanged, never printed)
        run: |
          set -uo pipefail
          AUD="https://iam.googleapis.com/${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}"

          TOK="$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
                   "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUD}" | jq -r '.value // empty')"
          if [ -z "${TOK}" ]; then
            echo '::error title=OIDC::GitHub did not mint an id-token for this job.'
            exit 1
          fi
          echo "::add-mask::${TOK}"

          # Field 2 is the payload. Field 3 (the signature) is never read.
          PAY="$(printf '%s' "${TOK}" | cut -d. -f2)"
          PAY="${PAY//-/+}"; PAY="${PAY//_/\/}"
          case $(( ${#PAY} % 4 )) in 2) PAY="${PAY}==";; 3) PAY="${PAY}=";; esac
          CLAIMS="$(printf '%s' "${PAY}" | base64 -d 2>/dev/null)"
          [ -n "${CLAIMS}" ] || { echo '::error title=OIDC::payload did not decode'; exit 1; }

          echo 'Identity claims Google evaluated (allow-listed; nothing else printed):'
          printf '%s' "${CLAIMS}" | jq -r '
            {sub, aud, iss,
             repository, repository_owner, repository_owner_id, repository_id,
             ref, ref_type, workflow, workflow_ref, job_workflow_ref,
             event_name, actor, actor_id, environment, runner_environment}
            | to_entries[] | select(.value != null)
            | "    \(.key) = \(.value)"'

          {
            echo
            echo "### OIDC claims presented to the provider"
            echo '```'
            printf '%s' "${CLAIMS}" | jq -r '
              {sub, aud, repository, repository_owner, ref, workflow,
               workflow_ref, job_workflow_ref, event_name}
              | to_entries[] | select(.value != null) | "\(.key) = \(.value)"'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Who are we, and on which project
        run: |
          set -uo pipefail
          echo "Federated principal : $(gcloud config get-value account 2>/dev/null)"
          echo "Target project      : ${GCP_PROJECT}"
          NUM="$(gcloud projects describe "${GCP_PROJECT}" --format='value(projectNumber)' 2>/dev/null || true)"
          echo "Project number      : ${NUM:-<unreadable>}"
          if [ "${NUM:-}" = "${GCP_PROJECT_NUMBER}" ]; then
            echo 'Project identity    : MATCH'
          else
            echo '::warning title=Project identity::Could not confirm the project number from this principal.'
          fi

      - name: What IAM does this principal actually hold (assert by effect)
        run: |
          set -uo pipefail
          SA="${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}"
          echo "Roles held by ${SA} on ${GCP_PROJECT}:"
          gcloud projects get-iam-policy "${GCP_PROJECT}" \
            --flatten='bindings[].members' \
            --filter="bindings.members:serviceAccount:${SA}" \
            --format='value(bindings.role)' 2>/dev/null | sort -u | sed 's/^/    /' \
            || echo '    <could not read the project IAM policy>'

          echo
          echo 'Bootstrap readiness (the five roles this remediation needs):'
          HELD="$(gcloud projects get-iam-policy "${GCP_PROJECT}" --flatten='bindings[].members' \
                   --filter="bindings.members:serviceAccount:${SA}" \
                   --format='value(bindings.role)' 2>/dev/null || true)"
          READY=1
          for R in roles/serviceusage.apiKeysAdmin roles/serviceusage.serviceUsageAdmin roles/billing.projectManager; do
            if printf '%s\n' "$HELD" | grep -Fxq "$R"; then
              echo "    HELD    $R"
            else
              echo "    MISSING $R"
              READY=0
            fi
          done
          if [ "$READY" -eq 1 ]; then
            echo 'PROJECT ROLES READY - the Cloud Shell bootstrap has been run.'
          else
            echo 'PROJECT ROLES NOT YET GRANTED - the Cloud Shell bootstrap is still pending.'
          fi

      - name: Billing state of the controlled project
        run: |
          set -uo pipefail
          echo 'Reading billing through the documented beta surface:'
          if OUT="$(gcloud beta billing projects describe "${GCP_PROJECT}" \
                     --format='value(billingEnabled,billingAccountName)' 2>/dev/null)"; then
            EN="$(printf '%s\n' "$OUT" | awk -F'\t' '{print $1}')"
            AC="$(printf '%s\n' "$OUT" | awk -F'\t' '{print $2}')"
            echo "    billingEnabled    : ${EN:-<empty>}"
            echo "    billingAccountName: ${AC:-<none>}"
            if [ -n "${AC:-}" ]; then
              OPEN="$(gcloud beta billing accounts describe "${AC#billingAccounts/}" \
                        --format='value(open)' 2>/dev/null || true)"
              echo "    account open      : ${OPEN:-<unreadable - needs billing.accounts.get>}"
            fi
            if [ "${EN:-}" = 'True' ]; then
              echo 'BILLING LOOKS LIVE on the controlled project -> the bootstrap will take CASE A.'
            else
              echo 'BILLING NOT ENABLED on the controlled project -> the bootstrap will take CASE B/C/D.'
            fi
          else
            echo '    <cannot read billing - this principal has no billing permission yet>'
            echo 'Expected before the bootstrap. Not an error.'
          fi

      - name: Which Maps services are already enabled
        run: |
          set -uo pipefail
          echo 'Enabled services matching the Maps families this product calls:'
          gcloud services list --enabled --project "${GCP_PROJECT}" --format='value(config.name)' 2>/dev/null \
            | grep -E 'geocoding|places|distance-matrix|static-maps|street-view|maps' | sed 's/^/    /' \
            || echo '    <none matched, or the service list is not readable from this principal>'

      - name: Note what this probe deliberately did not do
        run: |
          echo 'This probe did NOT list, read or describe any API key.'
          echo 'The legacy credential is out of scope: LEGACY GOOGLE MAPS KEY - PRESERVED / DEPENDENCY STATUS UNKNOWN.'

  # ---------------------------------------------------------------------------
  # EXECUTE - the remediation itself.
  # ---------------------------------------------------------------------------
  execute:
    runs-on: ubuntu-latest
    needs: mode
    # Deliberate invocation is required on BOTH counts: the mode must say so
    # AND the run must be a dispatch. Landing on `main` cannot start this,
    # even if someone later adds `main` to the push branches above.
    if: needs.mode.outputs.mode == 'execute' && github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: The Supabase credential this job needs must be configured
        env:
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "${ACCESS_TOKEN:-}" ]; then
            echo '::error title=Missing configuration::SUPABASE_ACCESS_TOKEN is not set on this repository.'
            exit 1
          fi
          echo 'SUPABASE_ACCESS_TOKEN is configured.'

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      # -- 1. Billing, asserted by effect --------------------------------------
      - name: Verify billing on the controlled project
        run: |
          set -euo pipefail
          NUM="$(gcloud projects describe "${GCP_PROJECT}" --format='value(projectNumber)')"
          [ "$NUM" = "${GCP_PROJECT_NUMBER}" ] || {
            echo "::error title=Project identity::expected ${GCP_PROJECT_NUMBER}, got ${NUM}"; exit 1; }

          OUT="$(gcloud beta billing projects describe "${GCP_PROJECT}" \
                   --format='value(billingEnabled,billingAccountName)')"
          EN="$(printf '%s\n' "$OUT" | awk -F'\t' '{print $1}')"
          AC="$(printf '%s\n' "$OUT" | awk -F'\t' '{print $2}')"
          AC_ID="${AC#billingAccounts/}"

          echo "billingEnabled     : ${EN}"
          echo "billingAccountName : ${AC_ID:-<none>}"

          if [ "$EN" != 'True' ] || [ -z "$AC_ID" ]; then
            echo '::error title=Billing::The controlled project is not linked to an enabled billing account.'
            echo 'The Cloud Shell bootstrap determines and attaches the account; it has not completed.'
            exit 1
          fi

          OPEN="$(gcloud beta billing accounts describe "$AC_ID" --format='value(open)')"
          echo "account open       : ${OPEN}"
          [ "$OPEN" = 'True' ] || {
            echo '::error title=Billing::The linked billing account is closed or disabled.'; exit 1; }

          echo 'ACCEPTANCE: linked + billingEnabled=True + open=True'
          {
            echo
            echo "### Billing"
            echo "| check | value |"
            echo "|---|---|"
            echo "| billingAccountName | \`${AC_ID}\` |"
            echo "| billingEnabled | ${EN} |"
            echo "| account open | ${OPEN} |"
          } >> "$GITHUB_STEP_SUMMARY"

      # -- 2. Resolve the exact Google service ids -----------------------------
      - name: Resolve endpoint to Google service from the live catalogue
        id: services
        run: |
          set -euo pipefail
          gcloud services list --available --project "${GCP_PROJECT}" \
            --format='value(config.name)' > /tmp/available.txt
          echo "Catalogue entries visible: $(wc -l < /tmp/available.txt)"

          # Endpoint -> service. Seven production endpoints resolve onto FIVE
          # services, because the legacy Places backend serves both
          # place/nearbysearch and place/autocomplete.
          declare -A NEEDED=(
            [geocoding-backend.googleapis.com]='/maps/api/geocode/json'
            [places-backend.googleapis.com]='/maps/api/place/nearbysearch/json + /maps/api/place/autocomplete/json'
            [distance-matrix-backend.googleapis.com]='/maps/api/distancematrix/json'
            [static-maps-backend.googleapis.com]='/maps/api/staticmap'
            [street-view-image-backend.googleapis.com]='/maps/api/streetview + /maps/api/streetview/metadata'
          )

          {
            echo
            echo "### Endpoint to Google service"
            echo "| production endpoint | Google service | in catalogue |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          LIST=''
          MISSING=0
          for SVC in "${!NEEDED[@]}"; do
            if grep -Fxq "$SVC" /tmp/available.txt; then
              echo "RESOLVED  ${NEEDED[$SVC]}  ->  $SVC"
              echo "| \`${NEEDED[$SVC]}\` | \`$SVC\` | yes |" >> "$GITHUB_STEP_SUMMARY"
              LIST="${LIST}${SVC} "
            else
              echo "::error title=Service not in catalogue::$SVC is not available on ${GCP_PROJECT}"
              echo "| \`${NEEDED[$SVC]}\` | \`$SVC\` | **NOT FOUND** |" >> "$GITHUB_STEP_SUMMARY"
              MISSING=1
            fi
          done
          [ "$MISSING" -eq 0 ] || {
            echo '::error::Refusing to guess a substitute service name.'; exit 1; }

          echo "services=$(echo $LIST)" >> "$GITHUB_OUTPUT"

      # -- 3. Enable only those -------------------------------------------------
      - name: Enable only the resolved services
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          gcloud services enable ${{ steps.services.outputs.services }} --project "${GCP_PROJECT}"
          echo 'Enable call accepted. Asserting by effect:'
          gcloud services list --enabled --project "${GCP_PROJECT}" --format='value(config.name)' > /tmp/enabled.txt
          FAIL=0
          for SVC in ${{ steps.services.outputs.services }}; do
            if grep -Fxq "$SVC" /tmp/enabled.txt; then echo "    ENABLED $SVC"; else echo "    NOT ENABLED $SVC"; FAIL=1; fi
          done
          [ "$FAIL" -eq 0 ] || { echo '::error title=Enablement::a service did not come back enabled'; exit 1; }

      # -- 4/5. Create the NEW key, restricted at creation ----------------------
      - name: Create the new dedicated backend key, restricted on creation
        id: key
        run: |
          set -euo pipefail
          TARGETS=''
          for SVC in ${{ steps.services.outputs.services }}; do
            TARGETS="${TARGETS} --api-target=service=${SVC}"
          done

          # Restrictions are applied IN the create call, so the key never exists
          # in an unrestricted state, not even for a second.
          # shellcheck disable=SC2086
          # Only NAME fields are ever formatted out of this call. The raw
          # create response carries `keyString`, so it must never be printed,
          # logged, or captured whole.
          RAW="$(gcloud services api-keys create \
            --display-name="${KEY_DISPLAY_NAME}" \
            ${TARGETS} \
            --project="${GCP_PROJECT}" \
            --format='value(response.name,name)')"
          KEY_RESOURCE="$(printf '%s' "$RAW" | tr '\t' '\n' | grep -m1 '^projects/' || true)"

          if [ -z "${KEY_RESOURCE}" ]; then
            echo '::error title=Key creation::create returned no resource name'; exit 1
          fi
          echo "Created key resource: ${KEY_RESOURCE}"
          echo "resource=${KEY_RESOURCE}" >> "$GITHUB_OUTPUT"

          echo 'Restrictions as stored:'
          gcloud services api-keys describe "${KEY_RESOURCE}" \
            --format='value(restrictions.apiTargets[].service)' | tr ';' '\n' | sed 's/^/    /'

          {
            echo
            echo "### New credential"
            echo "- display name: \`${KEY_DISPLAY_NAME}\`"
            echo "- API restrictions applied at creation:"
            for SVC in ${{ steps.services.outputs.services }}; do echo "  - \`$SVC\`"; done
            echo "- application restriction: **none** - Supabase Edge Functions publish no stable egress IP, and a guessed IP would break production"
          } >> "$GITHUB_STEP_SUMMARY"

      # -- 6. Prove the key works BEFORE it touches production -----------------
      - name: Direct Google geocode with the new key, before installing it
        id: geocode
        run: |
          set -euo pipefail
          KEY="$(gcloud services api-keys get-key-string '${{ steps.key.outputs.resource }}' --format='value(keyString)')"
          echo "::add-mask::$KEY"
          [ -n "$KEY" ] || { echo '::error title=Key string::empty'; exit 1; }

          # A newly minted key propagates through Google's edge over a few
          # minutes, so a single immediate call is not evidence either way.
          OK=0
          for I in $(seq 1 15); do
            BODY="$(curl -sS -G 'https://maps.googleapis.com/maps/api/geocode/json' \
                      --data-urlencode "address=${PROBE_ADDRESS}" \
                      --data-urlencode "key=${KEY}" || true)"
            STATUS="$(printf '%s' "$BODY" | jq -r '.status // "NO_STATUS"')"
            if [ "$STATUS" = 'OK' ]; then OK=1; break; fi
            echo "attempt ${I}: status=${STATUS} (propagating, retrying in 20s)"
            sleep 20
          done

          if [ "$OK" -ne 1 ]; then
            echo "::error title=Geocode failed::status=${STATUS} after 15 attempts over 5 minutes"
            printf '%s' "$BODY" | jq -r '.error_message // "no error_message"'
            echo 'Diagnosing against the NEW key only. The legacy key is not consulted or modified.'
            exit 1
          fi

          FADDR="$(printf '%s' "$BODY" | jq -r '.results[0].formatted_address')"
          LAT="$(printf '%s' "$BODY" | jq -r '.results[0].geometry.location.lat')"
          LNG="$(printf '%s' "$BODY" | jq -r '.results[0].geometry.location.lng')"
          echo "formatted_address : ${FADDR}"
          echo "lat, lng          : ${LAT}, ${LNG}"

          # HTTP 200 and status OK are not enough: the continent centroid is a
          # 200/OK answer too. The answer must genuinely be Cowra.
          echo "$FADDR" | grep -qi 'cowra' || {
            echo "::error title=Wrong place::formatted_address does not name Cowra"; exit 1; }
          jq -n --argjson lat "$LAT" --argjson lng "$LNG" \
            'if ($lat > -34.1 and $lat < -33.6 and $lng > 148.4 and $lng < 149.0)
             then "in-box" else error("coordinates are not Cowra") end' > /dev/null

          echo 'GEOCODE PASS: status OK, formatted_address names Cowra, coordinates inside the Cowra box.'
          {
            echo
            echo "### Direct geocode (new key, before install)"
            echo "- address: \`${PROBE_ADDRESS}\`"
            echo "- status: \`OK\`"
            echo "- formatted_address: ${FADDR}"
            echo "- lat, lng: ${LAT}, ${LNG} (inside the Cowra box)"
          } >> "$GITHUB_STEP_SUMMARY"

      # -- 7. Install into Supabase --------------------------------------------
      - name: Install the new key as this deployment's GOOGLE_MAPS_API_KEY
        env:
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          KEY="$(gcloud services api-keys get-key-string '${{ steps.key.outputs.resource }}' --format='value(keyString)')"
          echo "::add-mask::$KEY"

          # Read from supabase/config.toml, which is checked in. The ref is the
          # project's public hostname, not a credential.
          REF="$(sed -nE 's/^project_id[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' supabase/config.toml | head -1)"
          [ -n "$REF" ] || { echo '::error title=Project ref::not found in supabase/config.toml'; exit 1; }
          echo "Supabase project ref resolved from supabase/config.toml: ${REF}"

          export SUPABASE_ACCESS_TOKEN="$ACCESS_TOKEN"
          # The NAME is fixed in this file and is not an input. A workflow that
          # can write ANY Edge secret is a privilege escalation surface.
          supabase secrets set "GOOGLE_MAPS_API_KEY=$KEY" --project-ref "$REF" >/dev/null
          echo 'GOOGLE_MAPS_API_KEY written.'

      - name: Prove the name is present (digest only, never a value)
        env:
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          REF="$(sed -nE 's/^project_id[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' supabase/config.toml | head -1)"
          export SUPABASE_ACCESS_TOKEN="$ACCESS_TOKEN"
          # `secrets list` prints names and a sha256 digest, never a value.
          if supabase secrets list --project-ref "$REF" | grep -q GOOGLE_MAPS_API_KEY; then
            echo 'present: GOOGLE_MAPS_API_KEY'
            {
              echo
              echo "### Supabase cutover"
              echo "- project: \`${REF}\`"
              echo "- secret \`GOOGLE_MAPS_API_KEY\`: present (verified by name and digest; the value is never read back)"
              echo "- the legacy key was neither retrieved nor modified"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo '::error title=Missing::GOOGLE_MAPS_API_KEY was not set.'
            exit 1
          fi

      # -- 8. Quota ceilings ----------------------------------------------------
      - name: Record the quota position for the enabled services
        continue-on-error: true
        run: |
          set -uo pipefail
          {
            echo
            echo "### Quota position"
          } >> "$GITHUB_STEP_SUMMARY"
          for SVC in ${{ steps.services.outputs.services }}; do
            echo "--- $SVC"
            gcloud alpha services quota list \
              --service="$SVC" \
              --consumer="projects/${GCP_PROJECT_NUMBER}" \
              --format='table(metric,unit,quotaBuckets[].effectiveLimit)' 2>/dev/null \
              | head -20 || echo '    <quota surface not readable for this service>'
          done
          {
            echo "Recorded from \`gcloud alpha services quota list\`; see the job log for per-service detail."
            echo
            echo "Application-level daily caps already enforced in production:"
            echo "- \`GOOGLE_GEOCODING_DAILY_LIMIT\` (default 5000) - resolve-listing-coordinates"
            echo "- \`GOOGLE_PLACES_DAILY_LIMIT\` (default 5000) - google-places-autocomplete"
            echo "- \`GOOGLE_STREET_VIEW_DAILY_LIMIT\` (default 5000) - street-view, builderStock/images"
            echo
            echo "Enrichment idempotency (RF-7.2B.1B1) is the largest control: one enrichment is 8 Google calls"
            echo "(1 geocode + 6 Places Nearby + 1 Distance Matrix) bought once per report rather than once per resume."
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # CLEANUP - remove the temporary IAM once everything above is proven.
  # ---------------------------------------------------------------------------
  cleanup:
    runs-on: ubuntu-latest
    needs: mode
    # Deliberate invocation is required on BOTH counts: the mode must say so
    # AND the run must be a dispatch. Landing on `main` cannot start this,
    # even if someone later adds `main` to the push branches above.
    if: needs.mode.outputs.mode == 'cleanup' && github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Remove only the roles this remediation added
        run: |
          set -uo pipefail
          SA="${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}"
          MEMBER="serviceAccount:${SA}"

          echo 'BEFORE - project roles held:'
          gcloud projects get-iam-policy "${GCP_PROJECT}" --flatten='bindings[].members' \
            --filter="bindings.members:${MEMBER}" --format='value(bindings.role)' | sort -u | sed 's/^/    /'

          # The four standing roles are never named here, so no path in this job
          # can reach them: cloudbuild.builds.editor, iam.serviceAccountUser,
          # run.admin, storage.admin.
          for ROLE in roles/serviceusage.apiKeysAdmin roles/serviceusage.serviceUsageAdmin roles/billing.projectManager; do
            if gcloud projects remove-iam-policy-binding "${GCP_PROJECT}" \
                 --member="${MEMBER}" --role="${ROLE}" --condition=None --quiet --format='none' >/dev/null 2>&1; then
              echo "    REMOVED ${ROLE}"
            else
              echo "    NOT REMOVED ${ROLE} (absent, or no permission)"
            fi
          done

          AC="$(gcloud beta billing projects describe "${GCP_PROJECT}" --format='value(billingAccountName)' 2>/dev/null || true)"
          AC_ID="${AC#billingAccounts/}"
          if [ -n "${AC_ID:-}" ]; then
            for ROLE in roles/billing.user roles/billing.viewer; do
              if gcloud beta billing accounts remove-iam-policy-binding "${AC_ID}" \
                   --member="${MEMBER}" --role="${ROLE}" --quiet --format='none' >/dev/null 2>&1; then
                echo "    REMOVED ${ROLE} (billing account ${AC_ID})"
              else
                echo "    NOT REMOVED ${ROLE} (absent, or no permission)"
              fi
            done
          fi

          echo
          echo 'AFTER - project roles held:'
          gcloud projects get-iam-policy "${GCP_PROJECT}" --flatten='bindings[].members' \
            --filter="bindings.members:${MEMBER}" --format='value(bindings.role)' | sort -u | sed 's/^/    /'
          echo
          echo 'The WIF identity itself is retained. The legacy key remains untouched.'
