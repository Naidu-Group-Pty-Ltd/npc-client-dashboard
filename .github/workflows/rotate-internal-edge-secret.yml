name: Rotate the internal edge secret

# Makes the two halves of the internal signing envelope agree again.
#
# ## The failure this exists to repair
#
# `cron_signed_internal_headers` signs with the Vault's `internal_edge_secret`;
# `verifyInternal` verifies with the Edge runtime's `INTERNAL_EDGE_SECRET`.
# They are two copies of one secret and nothing keeps them in step. Measured in
# production on 2026-08-18, they had diverged:
#
#     security_events, decision = deny, reason = invalid_internal_signature
#       agent_task_runner.invoke             7,160   since 2026-07-23
#       email_sync_cron.invoke               7,158   since 2026-07-23
#       cross_portal_outbox_worker.invoke    2,856   since 2026-08-16
#
# 17,000+ rejected invocations. Every scheduled worker in the deployment was
# dead, including the one that drains `aml.screening.requested` — which is why
# AML screening requests sat with `attempts = 0` for ever.
#
# ## Why rotate rather than copy
#
# Neither copy can be read out to compare with the other, and neither should
# be: the fix must not involve moving a live secret through a log, a commit, a
# PR body or an operator's clipboard. So this issues a NEW value and writes it
# to both stores in one run. Nothing ever prints it — it is masked in the
# runner the moment it exists, and it travels only to the two secret stores
# that are supposed to hold it.
#
# ## Why this is safe to run
#
# Both halves are written by the same job, seconds apart. There is no working
# state to break: every signed invocation is already failing, so the window
# between the two writes cannot be worse than the status quo.
#
# Edge-to-edge signing is unaffected — `signInternalRequest` and
# `verifyInternal` both read the same env var, so sender and receiver move
# together.
#
# It does NOT weaken anything. `verifyInternal` is untouched, no fallback is
# added, no signature check is skipped. The envelope stays exactly as strict
# as it was; the two sides simply hold the same key again.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type ROTATE to confirm. This changes a production secret.'
        required: true
        type: string

concurrency:
  group: internal-edge-secret
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse without an explicit confirmation
        if: ${{ inputs.confirm != 'ROTATE' }}
        run: |
          echo '::error title=Not confirmed::Re-run and type ROTATE in the confirm box.'
          exit 1

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the credential this job needs is configured
        env:
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$ACCESS_TOKEN" ]; then
            echo '::error title=Missing configuration::SUPABASE_ACCESS_TOKEN is not set.'
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Rotate both halves
        env:
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          # Read from supabase/config.toml, which is checked in.
          #
          # The first attempt read the SUPABASE_URL secret and failed on it:
          # that secret is not configured on this repository, while
          # SUPABASE_ACCESS_TOKEN is. The ref is not sensitive — it is the
          # project's public hostname and already appears verbatim in the cron
          # job commands — so the checked-in value is the correct source and
          # removes a dependency on configuration that does not exist.
          REF="$(sed -nE 's/^project_id[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' supabase/config.toml | head -1)"
          if [ -z "$REF" ]; then
            echo '::error title=Project ref::No project_id found in supabase/config.toml.'
            exit 1
          fi
          echo 'Project ref resolved from supabase/config.toml.'

          # 64 hex characters, matching the length already in use. Masked
          # before it is used anywhere, so it cannot reach the run log even
          # through an error message or a `set -x`.
          NEW_SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$NEW_SECRET"

          # ── Half one: the Edge runtime ──────────────────────────────────
          # `verifyInternal` reads INTERNAL_EDGE_SECRET from here.
          export SUPABASE_ACCESS_TOKEN="$ACCESS_TOKEN"
          supabase secrets set "INTERNAL_EDGE_SECRET=$NEW_SECRET" --project-ref "$REF" >/dev/null
          echo 'Edge runtime secret set.'

          # ── Half two: the Vault ─────────────────────────────────────────
          # `cron_signed_internal_headers` signs with this. Written through the
          # Management API's SQL endpoint so no database credential is needed
          # and no new database surface is created.
          #
          # Built as a single-quoted SQL literal. `tojson` was wrong here: it
          # emits DOUBLE quotes, which Postgres reads as an identifier, so the
          # statement would have looked for a column named after the secret
          # rather than assigning it. The value is hex, and jq does the JSON
          # encoding, so nothing needs escaping beyond this.
          SQL="select vault.update_secret(id, '$NEW_SECRET') from vault.secrets where name = 'internal_edge_secret';"
          BODY="$(jq -nc --arg q "$SQL" '{query:$q}')"

          STATUS="$(curl -sS -o /tmp/rot.json -w '%{http_code}' \
            -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary "$BODY")"

          if [ "$STATUS" != '200' ] && [ "$STATUS" != '201' ]; then
            # The response body can echo the statement, so it is never printed.
            echo "::error title=Vault update failed::Management API returned $STATUS."
            exit 1
          fi
          echo 'Vault secret updated.'

      - name: Prove the two halves now agree
        env:
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          REF="$(sed -nE 's/^project_id[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' supabase/config.toml | head -1)"

          # The Edge runtime needs a moment to pick up a changed secret.
          sleep 45

          # Invoke the worker the way pg_cron does — a real signed envelope
          # built by the database function under test. Nothing is faked and no
          # secret leaves the database.
          Q='select public.cron_invoke_signed_function('"'"'cross-portal-outbox-worker'"'"', '"'"'{}'"'"'::jsonb, '"'"'pg_cron'"'"') as id;'
          curl -sS -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $ACCESS_TOKEN" -H 'Content-Type: application/json' \
            --data-binary "$(jq -nc --arg q "$Q" '{query:$q}')" >/dev/null
          sleep 20

          CHECK='select coalesce((select status_code from net._http_response order by created desc limit 1), 0) as status;'
          curl -sS -o /tmp/check.json -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $ACCESS_TOKEN" -H 'Content-Type: application/json' \
            --data-binary "$(jq -nc --arg q "$CHECK" '{query:$q}')"

          STATUS="$(jq -r '.[0].status // .result[0].status // 0' /tmp/check.json 2>/dev/null || echo 0)"
          echo "Latest signed invocation returned HTTP $STATUS."
          if [ "$STATUS" = '401' ] || [ "$STATUS" = '403' ]; then
            echo '::error title=Still rejected::The envelope is still being refused. Do not assume the rotation worked.'
            exit 1
          fi
          echo 'Signed invocation is no longer rejected.'
