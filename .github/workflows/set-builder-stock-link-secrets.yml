name: Set the Builder Stock link-recovery webhook URL

# Configures the one piece of external configuration the Google Sheets
# hyperlink recovery still needs.
#
# ## Why there is only one
#
# The recovery callback used to be authenticated by an HMAC envelope over a
# static secret held in BOTH Supabase and Make. That design had a distribution
# problem with no good answer: the two copies must be byte-identical, this
# runner can write Supabase but has no credential for Make, and a secret
# written to Supabase is not promised to be readable again — `supabase secrets
# list` reports a digest, not a value. So it could only ever be carried across
# by hand, and a live secret moving through somebody's clipboard is the thing
# secret management exists to prevent.
#
# It was replaced by a PER-REQUEST ONE-TIME CAPABILITY TOKEN, minted inside the
# Edge Function, sent to Make with the request it authorises, and stored only
# as a SHA-256. Nothing is shared, nothing is distributed, nothing is rotated —
# so there is no second secret for this workflow to set, and the hard part of
# this file simply stopped existing.
#
# ## What is left
#
# `MAKE_SHEET_LINKS_WEBHOOK_URL` is a capability rather than a secret: only this
# product sends to it, and possessing it buys nothing but the ability to make
# the scenario spend an operation on a document it will then refuse to attach
# anything to. It is not committed to this repository — it arrives as an input
# and is masked on arrival — and it is written to the one store that needs it.
#
# The name is FIXED IN THIS FILE and is not an input. A workflow that can write
# ANY Edge Function secret is a privilege escalation surface: anyone able to
# dispatch it could overwrite `INTERNAL_EDGE_SECRET` or a vendor credential.
#
# ── Who may run this ──────────────────────────────────────────────────────────
#
# This file travels. A mirror clone receives the whole tree, so a byte-identical
# copy of it sits in every clone repository today.
#
# Writing an Edge secret from CI needs a Supabase management credential, and
# this repository is the only one in the fleet that holds one. A clone's Edge
# secrets are written by Aurixa Mission Control instead, which keeps the
# credential and never forwards it: its `PRIME_ONLY_SECRETS` refuses
# `SUPABASE_ACCESS_TOKEN` by name, because a classic personal access token
# carries every project in the account, including ones created after it was
# issued.
#
# So on a clone this workflow can only reach its own "check the credential this
# job needs" step and fail. That is not harmless. A job that fails naming a
# missing setting is an invitation to go and set it, and the remedy this file's
# own error message invites is the one the architecture forbids.
#
# Ownership is therefore asserted positively, against a repository this file
# names. It is the rule `turnstileSiteKey.ts` applies to a built-in site key: a
# built-in is used only while the build IS the deployment it belongs to. A fork
# or a rename refuses and says what to edit, which is the safe direction.
#
# ## What it does NOT do
#
# It does not deploy, migrate, enable an organisation or trigger a recovery.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type SET to confirm. This writes production configuration.'
        required: true
        type: string
      webhook_url:
        description: 'The Make webhook URL (https://hook.<region>.make.com/<udid>). Masked on arrival.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: builder-stock-link-secrets
  cancel-in-progress: false

# The repository whose deployment these secrets belong to. Read only to decide
# whether this workflow may run at all; it selects no target and sends nothing
# anywhere.
env:
  EDGE_SECRET_OWNER_REPO: Naidu-Group-Pty-Ltd/npc-property-dashbord

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse in a repository that does not own this configuration
        # Compared in the shell rather than in a step `if:` expression, so it
        # rests on nothing but the `env` every `run` step already inherits — and
        # so a test can EXECUTE it. `edgeSecretWorkflowOwnership.test.ts` lifts
        # this script out of the file and runs it against the owner, a clone, a
        # fork and an undeclared owner.
        env:
          HERE: ${{ github.repository }}
        run: |
          if [ "$HERE" != "$EDGE_SECRET_OWNER_REPO" ]; then
            echo "::error title=Not this deployment's to set::$HERE is not $EDGE_SECRET_OWNER_REPO. Writing an Edge secret from CI needs a Supabase management credential, and that repository is the only one in the fleet that holds one. Ask Aurixa Mission Control, which writes this deployment's Edge secrets itself, rather than adding a Supabase credential to this repository."
            exit 1
          fi
          echo "$HERE owns this configuration."

      - name: Refuse without an explicit confirmation
        if: ${{ inputs.confirm != 'SET' }}
        run: |
          echo '::error title=Not confirmed::Re-run and type SET in the confirm box.'
          exit 1

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the credential this job needs is configured
        env:
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$ACCESS_TOKEN" ]; then
            echo '::error title=Missing configuration::SUPABASE_ACCESS_TOKEN is not set on this repository.'
            exit 1
          fi
          echo 'SUPABASE_ACCESS_TOKEN is configured.'

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Write the webhook URL
        env:
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          WEBHOOK_URL: ${{ inputs.webhook_url }}
        run: |
          set -euo pipefail

          # Redacted before it is used anywhere, so it cannot reach the run log
          # even through an error message or a `set -x`.
          echo "::add-mask::$WEBHOOK_URL"

          case "$WEBHOOK_URL" in
            https://hook.*.make.com/*) : ;;
            *) echo '::error title=Bad webhook::Not a Make hook URL.'; exit 1 ;;
          esac

          # Read from supabase/config.toml, which is checked in. The ref is the
          # project's public hostname, not a credential.
          REF="$(sed -nE 's/^project_id[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' supabase/config.toml | head -1)"
          if [ -z "$REF" ]; then
            echo '::error title=Project ref::No project_id found in supabase/config.toml.'
            exit 1
          fi
          echo 'Project ref resolved from supabase/config.toml.'

          export SUPABASE_ACCESS_TOKEN="$ACCESS_TOKEN"
          supabase secrets set "MAKE_SHEET_LINKS_WEBHOOK_URL=$WEBHOOK_URL" --project-ref "$REF" >/dev/null
          echo 'MAKE_SHEET_LINKS_WEBHOOK_URL set.'

      - name: Prove the name is present
        env:
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          REF="$(sed -nE 's/^project_id[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' supabase/config.toml | head -1)"
          export SUPABASE_ACCESS_TOKEN="$ACCESS_TOKEN"

          # `secrets list` prints names and a sha256 digest, never a value. It
          # renders a bordered table, so the whole line is matched rather than a
          # column: splitting on whitespace yields the border glyph, not a name.
          if supabase secrets list --project-ref "$REF" | grep -q MAKE_SHEET_LINKS_WEBHOOK_URL; then
            echo 'present: MAKE_SHEET_LINKS_WEBHOOK_URL'
          else
            echo '::error title=Missing::MAKE_SHEET_LINKS_WEBHOOK_URL was not set.'
            exit 1
          fi
