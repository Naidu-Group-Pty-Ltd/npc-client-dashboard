name: Set the Builder Stock PDF worker bearer

# Makes the two halves of the PDF election bearer agree.
#
# ## What this configures
#
# The heavy PDF election runs on `builder-stock-pdf-worker` (Cloudflare) and is
# called by the Builder Stock settler (Supabase Edge). One shared bearer is the
# only door into that worker, and it has to be byte-identical in two stores:
#
#     Cloudflare   the worker's own `BUILDER_STOCK_PDF_WORKER_TOKEN` secret
#     Supabase     the Edge runtime secret `electionRoute` reads
#
# `BUILDER_STOCK_PDF_WORKER_URL` is written alongside it. That one is not a
# secret — it is a public hostname that refuses every request without the
# bearer — but it is the other half of the configuration and belongs in the
# same act, because a URL with no token and a token with no URL both resolve to
# `no_capacity`, which is the same outcome as not running this at all.
#
# ## Why it ROTATES rather than carries a value across
#
# Exactly the reasoning in `rotate-internal-edge-secret.yml`. Neither store
# will read a secret back out, and neither should: the fix must not involve
# moving a live credential through a run log, a commit, a PR body, a chat
# window or an operator's clipboard. A `workflow_dispatch` input is not a
# private channel either — inputs are recorded against the run and readable by
# anyone with read access — which is why `set-builder-stock-link-secrets.yml`
# takes a capability URL as an input and would not take a secret.
#
# So this issues a NEW value inside the runner and writes it to both stores in
# one job. Nothing ever prints it. It is masked the moment it exists and
# travels only to the two places that are supposed to hold it.
#
# ## Why this is safe to run, at any time
#
# Both halves are written by the same job, seconds apart, and every failure in
# the window between them is `unreachable` — the operational, retryable answer.
# Nothing is written down about a document, no property is retired, and no
# verdict changes. Under `RUNTIME_VERSION` 2 the settler does not call the
# worker at all, so the first run has no window to speak of.
#
# ── Who may run this ──────────────────────────────────────────────────────────
#
# This file travels. A mirror clone receives the whole tree, so a byte-identical
# copy of it sits in every clone repository today.
#
# Writing an Edge secret from CI needs a Supabase management credential, and
# this repository is the only one in the fleet that holds one. A clone's Edge
# secrets are written by Aurixa Mission Control instead, which keeps the
# credential and never forwards it: its `PRIME_ONLY_SECRETS` refuses
# `SUPABASE_ACCESS_TOKEN` by name, because a classic personal access token
# carries every project in the account, including ones created after it was
# issued.
#
# So on a clone this workflow can only reach its own "check the credential this
# job needs" step and fail. That is not harmless. A job that fails naming a
# missing setting is an invitation to go and set it, and the remedy this file's
# own error message invites is the one the architecture forbids.
#
# Ownership is therefore asserted positively, against a repository this file
# names. It is the rule `turnstileSiteKey.ts` applies to a built-in site key: a
# built-in is used only while the build IS the deployment it belongs to. A fork
# or a rename refuses and says what to edit, which is the safe direction.#
# Here there is a second and sharper reason. The Supabase half resolves its
# target from the repository's OWN `supabase/config.toml`, so on a clone it
# would write to that clone's project — wrong, but contained. The Cloudflare
# half has no such indirection: `wrangler secret put` reads
# `cloudflare/builder-stock-pdf-worker/wrangler.jsonc`, which every clone also
# carries byte-identical, and it names `builder-stock-pdf-worker` — one worker,
# on one account. A clone that acquired a Cloudflare token and ran this would
# rotate THAT worker's bearer and store the new value in its own Supabase
# project, leaving the owner's copy stale. The proof step below would report
# success either way, because it probes the worker it has just written to.
#
# ## The names are FIXED IN THIS FILE
#
# A workflow that can write any Edge Function secret is a privilege escalation
# surface: anyone able to dispatch it could overwrite `INTERNAL_EDGE_SECRET` or
# a vendor credential. Only these two names can be written here, and the value
# of the secret one cannot be chosen by the caller.
#
# ## What it does NOT do
#
# It does not deploy the worker, deploy an Edge Function, migrate, advance
# `RUNTIME_VERSION`, requeue a property or touch a single row.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type SET to confirm. This writes production configuration.'
        required: true
        type: string
      worker_url:
        description: 'The deployed worker origin. Must be https and *.workers.dev.'
        required: true
        default: 'https://builder-stock-pdf-worker.builder-stock-image-worker.workers.dev'
        type: string

permissions:
  contents: read

concurrency:
  group: builder-stock-pdf-worker-secrets
  cancel-in-progress: false

# The repository whose deployment these secrets belong to. Read only to decide
# whether this workflow may run at all; it selects no target and sends nothing
# anywhere.
env:
  EDGE_SECRET_OWNER_REPO: Naidu-Group-Pty-Ltd/npc-property-dashbord

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse in a repository that does not own this configuration
        # Compared in the shell rather than in a step `if:` expression, so it
        # rests on nothing but the `env` every `run` step already inherits — and
        # so a test can EXECUTE it. `edgeSecretWorkflowOwnership.test.ts` lifts
        # this script out of the file and runs it against the owner, a clone, a
        # fork and an undeclared owner.
        env:
          HERE: ${{ github.repository }}
        run: |
          if [ "$HERE" != "$EDGE_SECRET_OWNER_REPO" ]; then
            echo "::error title=Not this deployment's to set::$HERE is not $EDGE_SECRET_OWNER_REPO. Writing an Edge secret from CI needs a Supabase management credential, and that repository is the only one in the fleet that holds one. Ask Aurixa Mission Control, which writes this deployment's Edge secrets itself, rather than adding a Supabase credential to this repository."
            echo "::error title=And it would not be local::This workflow also writes a Cloudflare secret, and wrangler.jsonc names one worker on one account. Running it here would rotate that worker's bearer for every deployment that calls it."
            exit 1
          fi
          echo "$HERE owns this configuration."

      - name: Refuse without an explicit confirmation
        if: ${{ inputs.confirm != 'SET' }}
        run: |
          echo '::error title=Not confirmed::Re-run and type SET in the confirm box.'
          exit 1

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the credentials this job needs are configured
        env:
          SUPABASE_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          if [ -z "$SUPABASE_TOKEN" ]; then
            echo '::error title=Missing configuration::SUPABASE_ACCESS_TOKEN is not set on this repository.'
            missing=1
          fi
          if [ -z "$CF_TOKEN" ]; then
            echo '::error title=Missing configuration::CLOUDFLARE_API_TOKEN is not set on this repository. It needs Workers Scripts:Edit on the account that hosts builder-stock-pdf-worker.'
            missing=1
          fi
          if [ -z "$CF_ACCOUNT" ]; then
            echo '::error title=Missing configuration::CLOUDFLARE_ACCOUNT_ID is not set on this repository.'
            missing=1
          fi
          [ "$missing" = 0 ] || exit 1
          echo 'Both credentials are configured.'

      - uses: actions/setup-node@v4
        with:
          # wrangler 4 requires Node 22 or newer.
          node-version: '22'

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Write both halves
        env:
          SUPABASE_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_URL: ${{ inputs.worker_url }}
          CI: 'true'
        run: |
          set -euo pipefail

          # The origin the settler will send multi-megabyte brochures to, so it
          # is checked rather than trusted. `*.workers.dev` on https is the
          # deployment this repository builds; pointing it anywhere else is a
          # deliberate edit to this file, not a box somebody types into.
          #
          # The host is isolated before it is judged. A `case` glob is the
          # wrong instrument on its own: `*` matches a slash, so the pattern
          # `https://*.workers.dev` also accepts
          # `https://elsewhere.example/x.workers.dev` — an origin on somebody
          # else's host with our suffix in its PATH.
          #
          # Trailing slash removed first, here as well as in `electionRoute`,
          # so the value stored is the one the code would have derived anyway.
          WORKER_URL="${WORKER_URL%/}"
          REST="${WORKER_URL#https://}"
          if [ "$REST" = "$WORKER_URL" ]; then
            echo '::error title=Bad worker URL::Must be https.'; exit 1
          fi
          case "$REST" in
            *[/?#@]*) echo '::error title=Bad worker URL::Origin only — no path, query, fragment or credentials.'; exit 1 ;;
          esac
          case "$REST" in
            *.workers.dev) : ;;
            *) echo '::error title=Bad worker URL::Expected https://<name>.<subdomain>.workers.dev'; exit 1 ;;
          esac

          # 64 hex characters, matching the length already in use elsewhere in
          # this deployment. Masked before it is used anywhere, so it cannot
          # reach the run log through an error message or a `set -x`.
          NEW_TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$NEW_TOKEN"

          # ── Half one: Cloudflare ────────────────────────────────────────
          # `printf` rather than `echo`, because wrangler stores what it is
          # given and a trailing newline would produce a bearer that is
          # silently one byte longer than the one Supabase sends.
          printf '%s' "$NEW_TOKEN" \
            | npx --yes wrangler@4.129.1 secret put BUILDER_STOCK_PDF_WORKER_TOKEN \
                --config cloudflare/builder-stock-pdf-worker/wrangler.jsonc >/dev/null
          echo 'Cloudflare worker secret set.'

          # ── Half two: the Supabase Edge runtime ─────────────────────────
          # Read the ref from supabase/config.toml, which is checked in. It is
          # the project's public hostname, not a credential.
          REF="$(sed -nE 's/^project_id[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' supabase/config.toml | head -1)"
          if [ -z "$REF" ]; then
            echo '::error title=Project ref::No project_id found in supabase/config.toml.'
            exit 1
          fi
          export SUPABASE_ACCESS_TOKEN="$SUPABASE_TOKEN"
          supabase secrets set \
            "BUILDER_STOCK_PDF_WORKER_TOKEN=$NEW_TOKEN" \
            "BUILDER_STOCK_PDF_WORKER_URL=$WORKER_URL" \
            --project-ref "$REF" >/dev/null
          echo 'Supabase Edge secrets set.'

          # Carried to the proof step in the runner's own file, never printed.
          # `add-mask` above applies to every later step in this job.
          printf '%s' "$NEW_TOKEN" > "$RUNNER_TEMP/bearer"
          printf '%s' "$WORKER_URL" > "$RUNNER_TEMP/origin"

      - name: Prove the two halves agree
        env:
          SUPABASE_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          BEARER="$(cat "$RUNNER_TEMP/bearer")"
          ORIGIN="$(cat "$RUNNER_TEMP/origin")"

          # The worker is asked a question it will refuse for free: GET on the
          # election path. Authentication runs FIRST and routing second, so a
          # 404 means the bearer was accepted and nothing was decoded — no CPU
          # spent, no document sent, and an unambiguous answer about the one
          # thing being tested. 401 means the two stores disagree.
          #
          # This is the same shape as `verification_selftest`: a deliberately
          # incomplete call, where being rejected in the RIGHT way is the pass.
          CODE="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $BEARER" "$ORIGIN/v1/elect")"
          if [ "$CODE" = '401' ]; then
            echo '::error title=Halves disagree::The worker refused the bearer that was just written to both stores.'
            exit 1
          fi
          if [ "$CODE" != '404' ]; then
            echo "::error title=Unexpected::GET /v1/elect answered $CODE; expected 404 for an authorised caller."
            exit 1
          fi
          echo 'The worker accepts the new bearer.'

          # And the door is still shut to everyone else. A worker that answered
          # 404 to anything would pass the check above while being wide open.
          WRONG="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H 'Authorization: Bearer not-the-token' "$ORIGIN/v1/elect")"
          if [ "$WRONG" != '401' ]; then
            echo "::error title=Not guarded::A wrong bearer answered $WRONG, not 401."
            exit 1
          fi
          echo 'The worker still refuses a wrong bearer.'

          # The Supabase half cannot be read back — `secrets list` reports a
          # name and a digest, never a value — so it is verified by presence,
          # exactly as `set-builder-stock-link-secrets.yml` verifies its own.
          # The bordered table means the whole line is matched rather than a
          # column: splitting on whitespace yields a border glyph, not a name.
          REF="$(sed -nE 's/^project_id[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' supabase/config.toml | head -1)"
          export SUPABASE_ACCESS_TOKEN="$SUPABASE_TOKEN"
          LIST="$(supabase secrets list --project-ref "$REF")"
          for NAME in BUILDER_STOCK_PDF_WORKER_TOKEN BUILDER_STOCK_PDF_WORKER_URL; do
            if printf '%s' "$LIST" | grep -q "$NAME"; then
              echo "present: $NAME"
            else
              echo "::error title=Missing::$NAME was not set."
              exit 1
            fi
          done

      - name: Remove the runner's copy
        if: always()
        run: rm -f "$RUNNER_TEMP/bearer" "$RUNNER_TEMP/origin"
