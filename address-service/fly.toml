# The address service on Fly.io — deployed only by
# `.github/workflows/address-service.yml` when a person dispatches it with
# `deploy: true`, after the image has proved itself in the CI runner.
#
# ALWAYS ON, deliberately. Photon's own start measured 5.5–9.9 s on four
# unshared vCPUs, and the geocoding chain gives a provider 6 s: a machine that
# stopped when idle would fail the first geocode after every quiet spell, and
# that geocode would fall to a suburb centroid — the failure this service
# exists to end. One shared-cpu-2x with 2 GB, in Sydney: see
# `docs/integrations/ADDRESS_SERVICE.md` for what it costs.
#
# BLUEGREEN, because the image is stateless (no volume): the new machine boots
# beside the old one and traffic moves only once its health check passes.

app = "aurixa-address-service"
primary_region = "syd"

[deploy]
  strategy = "bluegreen"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 80

  # Photon's /status, answered only once its index is open. The grace period
  # covers opening a ~2–3 GB index on shared CPU.
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "120s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2048mb"
