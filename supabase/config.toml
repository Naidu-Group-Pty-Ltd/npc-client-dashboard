# Browser-called, so the gateway JWT check must stay OFF.
#
# A CORS preflight carries no `Authorization` header — browsers never send one —
# so with `verify_jwt = true` the gateway rejects the OPTIONS with a 503 and its
# own wildcard CORS headers, and the function never runs at all. The browser
# then fails the preflight and `fetch` rejects, which the app surfaces as
# "Network/CORS error calling <fn>". The deploy gate reported it as a CORS
# policy fault for months; it was this.
#
# Safe because the function authenticates itself before doing anything:
# `enforceCsrf` -> `verifyAuth` -> `requireModulePermission`.
[functions.legal-matters-admin]
verify_jwt = false

