# ─────────────────────────────────────────────────────────────────────────────
# Functions that were never declared here at all (added 15 Aug 2026).
#
# An omitted `[functions.X]` block is NOT "no opinion" — the CLI defaults
# `verify_jwt` to true, so silence in this file asserts that the gateway is
# checking a Supabase JWT in front of the function. For these 91 it was not:
# every one is deployed with the check OFF, which is what they need and what
# their own code assumes.
#
# Silence therefore described 91 functions incorrectly, and the `mcp` block
# below records what that costs — that function had no entry either, and the
# first deploy to apply the default "would otherwise have silently flipped a
# working endpoint to true and broken every MCP client".
#
# It already cost something. `finance-portal-snoozes` has a `run_due` cron
# branch whose comment read "callable without partner session (cron + service)"
# — the gateway JWT was assumed to be standing in front of it. It was not, so
# the branch was reachable unauthenticated from anywhere on the internet. It now
# verifies the HMAC that `cron_invoke_signed_function` signs the schedule with.
#
# Every function below authenticates its own callers (session cookie, portal
# session token, or signed-internal HMAC); the gateway JWT is not the credential
# for any of them, and could not be — a browser holding this app's HttpOnly
# session cookie has no Supabase JWT to present, and a CORS preflight carries no
# Authorization header at all.
#
# `check-verify-jwt-declared.mjs` now fails CI on a function with no declaration,
# so this list cannot grow silently again.
# ─────────────────────────────────────────────────────────────────────────────

[functions.agent-insights-runner]
verify_jwt = false

